# Az Anura backend "ébren tartása": a Render ingyenes szervere ~15 perc
# tétlenség után elalszik, és a felébredés 30-90 mp - emiatt az első bejövő
# üzenet AI-elemzése időnként meghiúsult (demózáskor is kellemetlen).
#
# A korábbi "10 percenként egy cron-ping" megbízhatatlan volt, mert a GitHub
# az ütemezett futásokat gyakran késlelteti/kihagyja, így a tényleges rés néha
# 15 perc fölé nőtt, és a szerver mégis elaludt.
#
# Ez a verzió EGY hosszan futó munkát indít, ami 4 PERCENKÉNT pingel ~5,5 órán
# át, és 5 óránként újraindul (átfedéssel) - így a szerver folyamatosan ébren
# marad, függetlenül a GitHub cron pontatlanságától. Publikus repóban a
# GitHub Actions percek ingyenesek és korlátlanok.
name: Backend ébren tartása

on:
  schedule:
    - cron: "3 */5 * * *"   # 5 óránként indul (a 3. percben)
  workflow_dispatch: {}

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    # A GitHub munka-limit 6 óra; ez alatt maradunk, és 5 óránként újraindulunk.
    timeout-minutes: 350
    steps:
      - name: Ping /health 4 percenként ~5 óra 45 percig
        run: |
          end=$((SECONDS + 20700))   # 345 perc = 5h45m
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://anura-1apx.onrender.com/health || echo "000")
            echo "$(date -u +%H:%M:%S) Backend: HTTP $code"
            sleep 240   # 4 perc
          done
