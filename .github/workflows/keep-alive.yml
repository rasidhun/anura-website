# Az Anura backend "ébren tartása": a Render ingyenes szervere ~15 perc
# tétlenség után elalszik, és a felébredés 30-90 mp - emiatt az első bejövő
# üzenet AI-elemzése időnként meghiúsult. Ez a workflow 10 percenként
# megpingeli a szervert, így gyakorlatilag sosem alszik el.
# (Publikus repóban a GitHub Actions futtatás ingyenes és korlátlan.)
name: Backend ébren tartása

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health-ping
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://anura-1apx.onrender.com/health || echo "000")
          echo "Backend válasz: HTTP $code"
